<!doctype html>

<title>Historical Peninsula Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column like a pilgrim's card; porphyry accent, mosaic gold marks what's done. */
:root{
  --bg:#efeeea; --card:#fbfaf7; --ink:#24202a; --muted:#6c6672; --line:#d9d5dc;
  --accent:#6b2a4a; --accent-ink:#fff; --gold:#a8822c; --ok:#2e6b4c; --warn:#a4561f; --soft:#e6e2e8;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17151a; --card:#211e25; --ink:#eeeaf0; --muted:#a9a1ae; --line:#38333d;
    --accent:#d48aac; --accent-ink:#17151a; --gold:#d6b25e; --ok:#73c49a; --warn:#e3a066; --soft:#2b2730;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17151a; --card:#211e25; --ink:#eeeaf0; --muted:#a9a1ae; --line:#38333d;
  --accent:#d48aac; --accent-ink:#17151a; --gold:#d6b25e; --ok:#73c49a; --warn:#e3a066; --soft:#2b2730;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body)}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.2;margin:0;letter-spacing:.04em;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0 0 .5em;letter-spacing:.05em}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.riddle{font-size:1.08rem;font-style:italic;white-space:pre-line;border-left:3px solid var(--gold);padding-left:12px;margin:.4em 0 .6em}
details{margin:.2em 0 .6em}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
details .riddle{font-size:1rem;color:var(--muted)}
label{display:block;font-weight:600;margin:.7em 0 .3em}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus,button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;border:0;border-radius:8px;padding:13px 16px;width:100%;margin-top:10px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost,.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.pill{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:20px}
.step{display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted)}
.dot.done{background:var(--gold);border-color:var(--gold);color:#fff}
.step .body{flex:1;min-width:0}
.step.locked{opacity:.45}
.msg{font-size:.92rem;margin:6px 0 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--warn)}
.small{font-size:.88rem;color:var(--muted);margin:.2em 0}
.progress{display:flex;gap:5px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--gold)}
img.proof{width:100%;max-width:100%;border-radius:8px;margin-top:10px;display:block}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.06em}
.fname{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;font-weight:700;background:var(--soft);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere;margin:.5em 0 0}
.pts{font-weight:600;color:var(--gold);white-space:nowrap}
.wc{font-size:.85rem;color:var(--muted);text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
.wc.ok{color:var(--ok)}
.notice{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 .4em}
.notice b{color:var(--accent)}
.log{font-size:.9rem;width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.log td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tablebox{overflow-x:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#cam{position:fixed;inset:0;background:#000;z-index:10;flex-direction:column;display:flex}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .bar{display:flex;gap:10px;background:#000;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#cam .bar button{margin:0}
#cam .bar .ghost{color:#fff;border-color:#555}
a{color:var(--accent)}
code{font-size:.9em}
</style>

</div>

const KEY="arthunt-v4";
const $=s=>document.querySelector(s);
const app=$("#app");

function toks(s){return String(s).toLocaleLowerCase("tr").replace(/ı/g,"i").normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(Boolean)}
function fnv(s){let x=0x811c9dc5;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,0x01000193)>>>0}return x}
function hx(s){return fnv(s).toString(16).padStart(8,"0")}
function keyHash(s){return hx(toks(s).join(""))}
function matches(input,groups){
  const t=toks(input), seen=new Set();
  for(let i=0;i<t.length;i++)for(let n=1;n<=3&&i+n<=t.length;n++)seen.add(hx(t.slice(i,i+n).join("")));
  return groups.every(g=>g.some(h=>seen.has(h)));
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function fmt(d){d=new Date(d);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function words(s){return (String(s).trim().match(/\S+/g)||[]).length}
// Proof code changes every 10 minutes; TAs can recompute it in TA tools.
function proofCode(studentNo,stepNo,d){
  const slot=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${Math.floor(d.getMinutes()/10)}`;
  return fnv(`${CONFIG.secret}|${String(studentNo).trim()}|${stepNo}|${slot}`).toString(36).toUpperCase().slice(-5).padStart(5,"0");
}
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const TR={ç:"c",Ç:"C",ğ:"g",Ğ:"G",ı:"i",İ:"I",ö:"o",Ö:"O",ş:"s",Ş:"S",ü:"u",Ü:"U"};
function fileSafe(s){return String(s).trim().replace(/[çÇğĞıİöÖşŞüÜ]/g,m=>TR[m]).normalize("NFD").replace(/[̀-ͯ]/g,"")
  .split(/[^A-Za-z0-9]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join("")}
function pdfName(){return `scavenger_hunt_${CONFIG.fileYear}_${fileSafe(S.first)}_${fileSafe(S.last)}_${fileSafe(S.ta)}.pdf`}

/* ---------------- storage: progress in localStorage, photos in IndexedDB ---------------- */
let S=load(), PH={}, adminMode=location.hash==="#admin", resetAsk=false, pdfBlob=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("arthunt",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function putPhoto(k,v){PH[k]=v;try{const db=await idb();db.transaction("photos","readwrite").objectStore("photos").put(v,k)}catch(e){}}
async function loadPhotos(){try{const db=await idb();await new Promise(res=>{
  const req=db.transaction("photos").objectStore("photos").openCursor();
  req.onsuccess=()=>{const c=req.result;if(c){PH[c.key]=c.value;c.continue()}else res()};req.onerror=()=>res()})}catch(e){}}
async function clearPhotos(){PH={};try{const db=await idb();db.transaction("photos","readwrite").objectStore("photos").clear()}catch(e){}}

function team(){return CONFIG.teams.find(t=>t.id===S.team)}
function steps(){const t=team();return t?[...t.stops,...CONFIG.sharedStops]:[]}
function cur(){return S.cur||(S.cur={solved:false,said:"",gps:null,check:false,checkSaid:"",photo:false,hint:false,text:""})}
function riddleHtml(r){return `<div class="riddle">${esc(r.en)}</div>${r.tr?`<details><summary>Türkçesi</summary><div class="riddle">${esc(r.tr)}</div></details>`:""}`}

/* ---------------- start over (student) ---------------- */
function resetHtml(){
  return resetAsk
    ?`<div class="card"><p class="msg bad" style="margin:0">Start over? This erases your answers and photos on this phone and takes you back to registration. It can't be undone.</p>
       <div class="row"><button id="rsYes">Erase and start over</button><button class="ghost" id="rsNo">Keep my progress</button></div></div>`
    :`<button class="ghost" id="rsAsk" style="margin-top:24px">Start over</button>`;
}
function wireReset(again){
  const a=$("#rsAsk"); if(a) a.onclick=()=>{resetAsk=true;again();setTimeout(()=>{const b=$("#rsNo");if(b)b.scrollIntoView({block:"center"})},0)};
  const y=$("#rsYes"); if(y) y.onclick=()=>{S={};save();clearPhotos();pdfBlob=null;resetAsk=false;render();scrollTo(0,0)};
  const n=$("#rsNo"); if(n) n.onclick=()=>{resetAsk=false;again()};
}

/* ---------------- screens ---------------- */
function render(){
  if(adminMode) return renderAdmin();
  if(!team()||!S.number) return renderStart();
  if(S.idx>=steps().length) return renderDone();
  renderStep();
}

function renderStart(){
  const taField=CONFIG.tas&&CONFIG.tas.length
    ?`<select id="ta"><option value="">Choose your TA</option>${CONFIG.tas.map(t=>`<option>${esc(t)}</option>`).join("")}</select>`
    :`<input id="ta" autocomplete="off">`;
  app.innerHTML=`
    <span class="pill" style="align-self:flex-start">${esc(CONFIG.course)}</span>
    <h1>${esc(CONFIG.title)}</h1>
    <p class="sub">${esc(CONFIG.intro)}</p>
    <div class="card">
      <label for="t">Your hunt</label>
      <select id="t">${CONFIG.teams.map(t=>`<option value="${t.id}">${esc(t.name)} · ${esc(t.concept)}</option>`).join("")}</select>
      <div class="row">
        <div><label for="fn">Name</label><input id="fn" autocomplete="given-name"></div>
        <div><label for="ln">Surname</label><input id="ln" autocomplete="family-name"></div>
      </div>
      <label for="no">Student number</label>
      <input id="no" inputmode="numeric" autocomplete="off">
      <label for="ta">TA's name</label>
      ${taField}
      <p class="small">Your name, number and TA appear on every photo and on the PDF you submit, so check the spelling.</p>
      <button id="go">Start the hunt</button>
      <p class="msg bad" id="e"></p>
    </div>`;
  const go=()=>{
    const no=$("#no").value.trim();
    if(no===CONFIG.adminPin){adminMode=true;return render()}
    const fn=$("#fn").value.trim(), ln=$("#ln").value.trim(), ta=$("#ta").value.trim();
    if(!fn||!ln){$("#e").textContent="Enter your name and surname.";return}
    if(!/^\d{4,}$/.test(no)){$("#e").textContent="Enter your student number using digits only.";return}
    if(!ta){$("#e").textContent="Choose or enter your TA's name.";return}
    clearPhotos();
    S={team:$("#t").value,first:fn,last:ln,number:no,ta,idx:0,log:[],started:Date.now()};save();render();
  };
  $("#go").onclick=go;
}

function renderStep(){
  const t=team(), list=steps(), s=list[S.idx], c=cur(), n=S.idx+1, place=s.kind==="place";
  const gpsNeeded=place&&s.lat!=null;
  const gpsDone=!gpsNeeded||(c.gps&&(c.gps.ok||c.gps.unavailable));
  const checkDone=!s.check||c.check;
  const photoDone=!s.photo||(c.photo&&PH["p"+S.idx]);
  const taskOk=()=>!s.task||words(c.text)>=s.task.minWords;
  const ready=()=>c.solved&&gpsDone&&checkDone&&photoDone&&taskOk();
  const lock=c.solved?"":" locked";
  let k=1; const items=[];

  items.push(`<div class="step"><div class="dot ${c.solved?"done":""}">${k++}</div><div class="body">
    <b>${esc(s.solveLabel||"Solve the riddle")}</b>
    ${c.solved?`<p class="msg ok">${place?`Correct: “${esc(c.said)}”. Head there now.`:`Correct: “${esc(c.said)}”.`}</p>`:`
      <input id="ans" autocomplete="off" placeholder="Your answer">
      <button class="ghost" id="solve">Check</button><p class="msg bad" id="ae"></p>`}
  </div></div>`);

  if(gpsNeeded) items.push(`<div class="step${lock}"><div class="dot ${c.solved&&gpsDone?"done":""}">${k++}</div><div class="body">
    <b>Location check</b>
    ${c.gps?`<p class="msg ${c.gps.ok?"ok":"bad"}">${esc(c.gps.text)}</p>`:`<p class="small">Use this when you've arrived.</p>`}
    ${c.solved&&!(c.gps&&(c.gps.ok||c.gps.unavailable))?`<button class="ghost" id="gps">I'm here, check my location</button>`:""}
  </div></div>`);

  if(s.check) items.push(`<div class="step${lock}"><div class="dot ${c.check?"done":""}">${k++}</div><div class="body">
    <b>On-site detail</b>
    <p class="small">${esc(s.check.q)}</p>
    ${c.check?`<p class="msg ok">Correct: “${esc(c.checkSaid)}”.</p>`:c.solved?`
      <input id="chk" autocomplete="off" placeholder="What you see">
      <button class="ghost" id="chkBtn">Check</button><p class="msg bad" id="ce"></p>`:""}
  </div></div>`);

  if(s.photo) items.push(`<div class="step${lock}"><div class="dot ${photoDone&&c.photo?"done":""}">${k++}</div><div class="body">
    <b>Photo of you at the spot</b>
    <p class="small">${esc(s.photoNote||"You at the spot.")} The photo is stamped with your name, number, the time, location and a proof code, and goes into your PDF.</p>
    ${c.photo&&PH["p"+S.idx]?`<img class="proof" src="${PH["p"+S.idx]}" alt="Stamped photo">`:""}
    ${c.solved?`<button ${c.photo?'class="ghost"':""} id="shoot">${c.photo?"Retake photo":"Take photo"}</button><p class="msg bad" id="pe"></p>`:""}
  </div></div>`);

  if(s.task) items.push(`<div class="step${lock}"><div class="dot ${c.solved&&taskOk()?"done":""}" id="tdot">${k++}</div><div class="body">
    <b>Question</b> <span class="pts">${s.task.points} ${s.task.points===1?"point":"points"}</span>
    <p class="small" style="color:var(--ink)">${esc(s.task.q)}</p>
    ${c.solved?`<textarea id="txt" placeholder="Write your answer here">${esc(c.text)}</textarea><div class="wc" id="wc"></div>`:""}
  </div></div>`);

  app.innerHTML=`
    <div class="top"><span class="pill">${esc(t.name)} · ${esc(t.concept)}</span>
      <span class="small">Step ${n} of ${list.length}</span></div>
    <div class="progress">${list.map((_,i)=>`<span class="${i<=S.idx?"on":""}"></span>`).join("")}</div>
    <div class="card">
      <h2>${esc(s.label)}</h2>
      ${riddleHtml(s.riddle)}
      ${s.hint?(c.hint?`<p class="small"><b>Hint:</b> ${esc(s.hint)}</p>`:`<button class="ghost" id="hint">Show hint (your TA will see you used it)</button>`):""}
    </div>
    <div class="card"><h2>${place?"Find it and prove you're there":"Answer"}</h2><div class="steps">${items.join("")}</div></div>
    <button id="next" ${ready()?"":"disabled"}>${n===list.length?"Finish the hunt":"Unlock the next riddle"}</button>
    <p class="small" id="nextNote" style="text-align:center">${ready()?"":"Complete every step above to continue."}</p>
    ${resetHtml()}`;
  wireReset(renderStep);

  const h=$("#hint"); if(h) h.onclick=()=>{c.hint=true;save();render()};
  const sv=$("#solve"); if(sv){
    const go=()=>{const v=$("#ans").value; if(matches(v,s.accept)){c.solved=true;c.said=v.trim();save();render()}else $("#ae").textContent="Not quite. Read the riddle again."};
    sv.onclick=go; $("#ans").onkeydown=e=>{if(e.key==="Enter")go()};
  }
  const g=$("#gps"); if(g) g.onclick=()=>checkGps(s);
  const cb=$("#chkBtn"); if(cb){
    const go=()=>{const v=$("#chk").value; if(matches(v,s.check.accept)){c.check=true;c.checkSaid=v.trim();save();render()}else $("#ce").textContent="Not quite. Look again."};
    cb.onclick=go; $("#chk").onkeydown=e=>{if(e.key==="Enter")go()};
  }
  const sh=$("#shoot"); if(sh) sh.onclick=openCamera;
  const tx=$("#txt");
  const upd=()=>{
    const w=words(tx.value), need=s.task.minWords, ok=w>=need;
    $("#wc").textContent=ok?`${w} words`:`${w} / at least ${need} words`;
    $("#wc").className="wc"+(ok?" ok":"");
    $("#tdot").className="dot"+(ok?" done":"");
    $("#next").disabled=!ready(); $("#nextNote").textContent=ready()?"":"Complete every step above to continue.";
  };
  if(tx){tx.oninput=()=>{c.text=tx.value;save();upd()};upd()}
  $("#next").onclick=()=>{
    if(!ready()) return;
    let loc="Not required at this step";
    if(gpsNeeded) loc=c.gps.ok?`Verified: ${c.gps.dist} m from the target${c.pos?` (GPS ${c.pos[0]}, ${c.pos[1]})`:""}`
      :"Not verified: location was unavailable or permission was denied";
    S.log.push({step:n,label:s.label,said:c.said,hint:c.hint,loc,locOk:gpsNeeded?!!c.gps.ok:null,
      checkQ:s.check?s.check.q:"",checkSaid:c.checkSaid||"",
      photoKey:s.photo?"p"+S.idx:null,time:c.time||"",code:c.code||"",source:c.source||"",
      q:s.task?s.task.q:"",points:s.task?s.task.points:0,text:c.text||"",done:Date.now()});
    S.idx++; S.cur=null; save(); render(); scrollTo(0,0);
  };
}

function checkGps(s){
  const c=cur();
  const fail=()=>{c.gps={ok:false,unavailable:true,text:"Location isn't available on this phone. Your PDF will show “location not verified” for this step."};save();render()};
  if(!navigator.geolocation) return fail();
  c.gps={ok:false,text:"Finding your location…"}; render();
  navigator.geolocation.getCurrentPosition(p=>{
    const d=dist(p.coords.latitude,p.coords.longitude,s.lat,s.lng);
    c.pos=[p.coords.latitude.toFixed(5),p.coords.longitude.toFixed(5)];
    c.gps=d<=CONFIG.gpsRadiusMeters?{ok:true,dist:Math.round(d),text:`You're here (${Math.round(d)} m from the target).`}
      :{ok:false,text:`You're about ${Math.round(d)} m away. Get closer and try again.`};
    save();render();
  },fail,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

/* ---------------- camera and stamp ---------------- */
let stream=null;
async function openCamera(){
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920}},audio:false});
      $("#video").srcObject=stream; $("#cam").hidden=false; return;
    }catch(e){}
  }
  $("#photoIn").click();
}
function closeCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("#cam").hidden=true}
$("#camCancel").onclick=closeCamera;
function scaled(src,w,h){
  const r=Math.min(1,1400/Math.max(w,h)), cv=document.createElement("canvas");
  cv.width=Math.round(w*r); cv.height=Math.round(h*r); cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height); return cv;
}
$("#camShoot").onclick=()=>{
  const v=$("#video"); const cv=scaled(v,v.videoWidth,v.videoHeight);
  closeCamera(); stamp(cv,"live camera");
};
$("#photoIn").onchange=e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(Date.now()-f.lastModified>15*60*1000){$("#pe").textContent="This photo is older than 15 minutes. Take a new one now.";return}
  const img=new Image(); img.onload=()=>{const cv=scaled(img,img.width,img.height);URL.revokeObjectURL(img.src);stamp(cv,"phone camera")};
  img.src=URL.createObjectURL(f);
};
function stamp(cv,source){
  const c=cur(), t=team(), now=new Date(), code=proofCode(S.number,S.idx+1,now);
  const ctx=cv.getContext("2d"), W=cv.width, fs=Math.max(15,Math.round(W/42)), H=fs*5;
  ctx.fillStyle="rgba(0,0,0,.64)"; ctx.fillRect(0,cv.height-H,W,H);
  ctx.fillStyle="#fff"; ctx.textBaseline="top";
  ctx.font=`700 ${fs}px sans-serif`;
  ctx.fillText(`${S.first} ${S.last} · ${S.number}`,fs*.6,cv.height-H+fs*.45);
  ctx.font=`600 ${Math.round(fs*.88)}px sans-serif`;
  ctx.fillText(`${t.name} · STEP ${S.idx+1} · ${fmt(now)} · CODE ${code}`,fs*.6,cv.height-H+fs*1.85);
  ctx.font=`${Math.round(fs*.78)}px sans-serif`;
  ctx.fillText(`${c.pos?`GPS ${c.pos[0]}, ${c.pos[1]}`:"no GPS"} · ${source} · TA ${S.ta}`,fs*.6,cv.height-H+fs*3.2);
  putPhoto("p"+S.idx,cv.toDataURL("image/jpeg",.72));
  c.photo=true; c.time=fmt(now); c.code=code; c.source=source; c.photoAt=now.getTime();
  save(); render();
}

/* ---------------- PDF ---------------- */
function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf);
  return new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>window.jspdf?res(window.jspdf):rej(new Error("load")); s.onerror=()=>rej(new Error("load"));
    document.head.appendChild(s); setTimeout(()=>rej(new Error("timeout")),20000);
  });
}
async function buildPdf(){
  const {jsPDF}=await loadJsPDF();
  const doc=new jsPDF({unit:"mm",format:"a4"});
  doc.addFileToVFS("DV.ttf",FONT_R); doc.addFont("DV.ttf","DV","normal");
  doc.addFileToVFS("DVB.ttf",FONT_B); doc.addFont("DVB.ttf","DV","bold");
  const M=18, W=210-2*M, BOTTOM=297-16; let y=M;
  const pt=s=>s*0.3528;
  const ensure=h=>{if(y+h>BOTTOM){doc.addPage();y=M}};
  const color=(r,g,b)=>doc.setTextColor(r,g,b);
  function para(text,{size=10,bold=false,rgb=[36,32,42],gap=1.5,indent=0}={}){
    doc.setFont("DV",bold?"bold":"normal"); doc.setFontSize(size); color(...rgb);
    const lh=pt(size)*1.4;
    String(text||"").split("\n").forEach(block=>{
      doc.splitTextToSize(block||" ",W-indent).forEach(line=>{ensure(lh);doc.text(line,M+indent,y+pt(size));y+=lh});
    });
    y+=gap;
  }
  function kv(k,v){
    doc.setFontSize(10); doc.setFont("DV","bold"); color(108,102,114);
    const kw=38; ensure(5); doc.text(k,M,y+pt(10));
    doc.setFont("DV","normal"); color(36,32,42);
    const lines=doc.splitTextToSize(String(v||"-"),W-kw);
    lines.forEach((l,i)=>{if(i)ensure(5);doc.text(l,M+kw,y+pt(10));y+=pt(10)*1.4});
    y+=0.8;
  }
  function rule(){ensure(4);doc.setDrawColor(217,213,220);doc.setLineWidth(0.3);doc.line(M,y+1,M+W,y+1);y+=4}
  const t=team(), total=S.log.reduce((a,l)=>a+l.points,0), last=S.log.length?S.log[S.log.length-1].done:Date.now();

  para(CONFIG.course,{size:9,rgb:[108,102,114],gap:0.5});
  para(CONFIG.title,{size:18,bold:true,rgb:[107,42,74],gap:2});
  kv("Student",`${S.first} ${S.last}`);
  kv("Student number",S.number);
  kv("TA",S.ta);
  kv("Hunt",`${t.name} · ${t.concept}`);
  kv("Started",fmt(S.started));
  kv("Finished",fmt(last));
  kv("PDF created",fmt(Date.now()));
  kv("Questions total",`${total} points`);
  y+=2; rule();

  // summary table
  para("Summary",{size:12,bold:true,gap:1});
  const cols=[{h:"Step",w:12},{h:"Riddle answer",w:52},{h:"Photo time",w:32},{h:"Code",w:16},{h:"Location",w:46},{h:"Hint",w:16}];
  function row(cells,head){
    doc.setFontSize(8.5); doc.setFont("DV",head?"bold":"normal");
    const wrapped=cells.map((c,i)=>doc.splitTextToSize(String(c),cols[i].w-2));
    const h=Math.max(...wrapped.map(w=>w.length))*pt(8.5)*1.35+2;
    ensure(h);
    if(head){doc.setFillColor(230,226,232);doc.rect(M,y,W,h,"F")}
    let x=M; color(36,32,42);
    wrapped.forEach((w,i)=>{w.forEach((l,j)=>doc.text(l,x+1,y+1+pt(8.5)*(1+1.35*j)));x+=cols[i].w});
    y+=h; doc.setDrawColor(217,213,220); doc.setLineWidth(0.2); doc.line(M,y,M+W,y);
  }
  row(cols.map(c=>c.h),true);
  S.log.forEach(l=>row([l.step,l.said,l.time||"-",l.code||"-",l.locOk===null?"Not required":l.locOk?"Verified":"NOT verified",l.hint?"Used":"No"]));
  y+=4;

  // step sections
  for(const l of S.log){
    doc.addPage(); y=M;
    para(`Step ${l.step} · ${l.label}`,{size:13,bold:true,rgb:[107,42,74],gap:2});
    kv("Riddle answer",l.said);
    if(l.checkQ) kv("On-site detail",`${l.checkQ}\nAnswer: ${l.checkSaid} (correct)`);
    kv("Location check",l.loc);
    kv("Hint used",l.hint?"Yes":"No");
    if(l.photoKey){
      kv("Photo",l.time?`${l.time} · proof code ${l.code} · ${l.source}`:"Missing");
      const img=PH[l.photoKey];
      if(img){
        const p=doc.getImageProperties(img); let w=W, h=w*p.height/p.width;
        if(h>120){h=120;w=h*p.width/p.height}
        ensure(h+3); doc.addImage(img,"JPEG",M,y+1,w,h); y+=h+4;
      }else para("The photo could not be found on this phone.",{size:10,rgb:[164,86,31]});
    }
    if(l.q){
      y+=1; rule();
      para(`Question (${l.points} ${l.points===1?"point":"points"})`,{size:10,bold:true,gap:0.5});
      para(l.q,{size:10,rgb:[80,74,86],gap:2});
      para(`Answer (${words(l.text)} words)`,{size:10,bold:true,gap:0.5});
      para(l.text.trim(),{size:10.5,gap:2});
    }
  }

  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i); doc.setFont("DV","normal"); doc.setFontSize(8); color(108,102,114);
    doc.text(`${S.first} ${S.last} · ${S.number} · ${t.name}`,M,297-9);
    doc.text(`Page ${i} of ${pages}`,210-M,297-9,{align:"right"});
  }
  return doc.output("blob");
}
// Inside the Claude viewer, files go through its download prompt; on the hosted site, a normal download.
async function giveFile(blob,name){
  if(window.claude&&window.claude.use){
    try{const d=await window.claude.use("downloads"); if(d){await d.save({filename:name,data:blob});return "saved"}}
    catch(e){if(e&&e.code==="declined")return "declined"}
  }
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
  return "saved";
}

/* ---------------- finish ---------------- */
function renderDone(){
  const t=team(), name=pdfName();
  app.innerHTML=`
    <span class="pill" style="align-self:flex-start">${esc(t.name)} · ${esc(t.concept)}</span>
    <h1>You made it.</h1>
    <div class="card">${riddleHtml(CONFIG.ending)}</div>
    <div class="card">
      <h2>Submit your PDF</h2>
      <div class="notice"><b>Download the PDF and upload it to the assignment on SUCourse without changing its name.</b> It holds all your answers, photos and location checks, and your TA grades from it.</div>
      <p class="small">File name:</p>
      <p class="fname">${esc(name)}</p>
      <p class="msg" id="pm">Preparing your PDF…</p>
      <button id="dl" disabled>Download PDF</button>
      <button class="ghost" id="share" hidden>Share or save to Files</button>
      <a class="btn ghost" href="${esc(CONFIG.submitUrl)}" target="_blank" rel="noopener">${esc(CONFIG.submitLabel)}</a>
      <p class="small">On iPhone the PDF goes to Files › Downloads; on Android to the Downloads folder.</p>
    </div>
    <div class="card tablebox"><h2>Your route</h2><table class="log">
      <tr><td><b>Step</b></td><td><b>Photo</b></td><td><b>Location</b></td><td><b>Hint</b></td></tr>
      ${S.log.map(l=>`<tr><td>${l.step}. ${esc(l.said)}</td><td>${esc(l.time||"-")}</td><td>${l.locOk===null?"-":l.locOk?"verified":"not verified"}</td><td>${l.hint?"used":"no"}</td></tr>`).join("")}
    </table></div>
    ${resetHtml()}`;
  wireReset(renderDone);
  const pm=$("#pm"), dl=$("#dl"), sh=$("#share");
  const ready=b=>{
    pdfBlob=b; dl.disabled=false; pm.textContent="";
    try{const f=new File([b],name,{type:"application/pdf"}); if(navigator.canShare&&navigator.canShare({files:[f]})&&!(window.claude&&window.claude.use)){sh.hidden=false;
      sh.onclick=()=>navigator.share({files:[f],title:name}).catch(()=>{})}}catch(e){}
  };
  (pdfBlob?Promise.resolve(pdfBlob):buildPdf()).then(ready).catch(()=>{
    pm.className="msg bad"; pm.textContent="The PDF couldn't be created. Check your internet connection, then tap Try again.";
    dl.disabled=false; dl.textContent="Try again"; dl.onclick=()=>{pdfBlob=null;renderDone()};
  });
  dl.onclick=async()=>{
    if(!pdfBlob) return;
    const r=await giveFile(pdfBlob,name);
    pm.className="msg "+(r==="saved"?"ok":"bad");
    pm.textContent=r==="saved"?"Downloaded. Now upload it to SUCourse without renaming it.":"Download cancelled. Tap Download PDF to try again.";
  };
}

/* ---------------- TA tools (#admin, or 9999 as student number) ---------------- */
function renderAdmin(){
  app.innerHTML=`
    <h1>TA tools</h1>
    <div class="card"><h2>Check a photo</h2>
      <p class="small">Enter the student number, the step and the time stamped on the photo. If the code on the photo matches, it was taken in this app in that 10-minute window, by that student.</p>
      <div class="row"><div><label for="vn">Student number</label><input id="vn" inputmode="numeric"></div>
      <div><label for="vs">Step no.</label><input id="vs" type="number" min="1" value="1"></div></div>
      <label for="vd">Date and time on the photo</label><input id="vd" type="datetime-local">
      <div id="vr"></div></div>
    <div class="card"><h2>Make accepted answers</h2>
      <p class="small">Separate keywords with commas. If the answer needs two things (e.g. two languages), separate the groups with a semicolon. Paste the result into CONFIG as <code>accept</code>.</p>
      <input id="ha" placeholder="e.g. greek, yunanca ; latin, latince"><p id="hr" class="msg ok code" style="overflow-wrap:anywhere;letter-spacing:0"></p>
      <label for="tt">Test an answer against it</label><input id="tt" autocomplete="off" placeholder="What a student might type"><p id="tr" class="msg"></p></div>
    <div class="card"><h2>This phone</h2>
      ${resetAsk?`<p class="msg bad">Erase all hunt progress and photos on this phone?</p><div class="row"><button id="rsYes">Erase</button><button class="ghost" id="rsNo">Keep</button></div>`
        :`<button class="ghost" id="rs">Reset progress on this phone</button>`}
      <p class="msg ok" id="rsMsg"></p>
      <button class="ghost" id="bk">Back to the hunt</button></div>`;
  const v=()=>{const d=$("#vd").value, no=$("#vn").value.trim(); if(!d||!no){$("#vr").innerHTML="";return}
    $("#vr").innerHTML=`<p class="msg ok">Expected code: <span class="code">${proofCode(no,+$("#vs").value,new Date(d))}</span></p>`};
  ["#vn","#vs","#vd"].forEach(id=>$(id).oninput=v);
  let groups=[];
  const test=()=>{const x=$("#tt").value; if(!x||!groups.length){$("#tr").textContent="";return}
    const ok=matches(x,groups); $("#tr").className="msg "+(ok?"ok":"bad"); $("#tr").textContent=ok?"Accepted.":"Not accepted."};
  $("#ha").oninput=e=>{
    groups=e.target.value.split(";").map(g=>g.split(",").map(w=>w.trim()).filter(w=>toks(w).length).map(keyHash)).filter(g=>g.length);
    $("#hr").textContent=groups.length?`accept:${JSON.stringify(groups)}`:""; test();
  };
  $("#tt").oninput=test;
  const rs=$("#rs"); if(rs) rs.onclick=()=>{resetAsk=true;renderAdmin()};
  const y=$("#rsYes"); if(y) y.onclick=()=>{S={};save();clearPhotos();pdfBlob=null;resetAsk=false;renderAdmin();$("#rsMsg").textContent="Progress erased."};
  const no=$("#rsNo"); if(no) no.onclick=()=>{resetAsk=false;renderAdmin()};
  $("#bk").onclick=()=>{adminMode=false;resetAsk=false;if(location.hash==="#admin")history.replaceState(null,"",location.pathname+location.search);render()};
}
window.addEventListener("hashchange",()=>{adminMode=location.hash==="#admin";render()});
app.innerHTML=`<p class="small">Loading…</p>`;
loadPhotos().then(render,render);
